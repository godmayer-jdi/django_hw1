{% extends 'catalog/base.html' %}
{% load static %}

{% block title %}Контакты - Skystore{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Контакты</h1>

    {% if success_message %}
        <div class="alert alert-success">{{ success_message }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Отправить</button>
    </form>
</div>
{% endblock %}
