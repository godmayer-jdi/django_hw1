{% extends 'catalog/base.html' %}
{% load static %}

{% block title %}Удалить продукт - Skystore{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0"><i class="bi bi-exclamation-triangle-fill me-2"></i>Подтверждение удаления</h3>
                </div>
                <div class="card-body text-center py-5">
                    <i class="bi bi-trash3-fill text-danger" style="font-size: 4rem;"></i>
                    <h4 class="mt-3 mb-4">Вы уверены?</h4>
                    <p class="lead text-muted mb-4">Продукт "<strong>{{ object.name }}</strong>" будет <strong>необратимо удален</strong>.</p>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-center">
                        <a href="{% url 'catalog:product_list' %}" class="btn btn-outline-secondary btn-lg px-5">
                            <i class="bi bi-x-circle me-2"></i>Отмена
                        </a>
                        <form method="post" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger btn-lg px-5" 
                                    onclick="return confirm('Действительно удалить?')">
                                <i class="bi bi-check-circle me-2"></i>Да, удалить
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
